openapi: 3.0.0
info:
  title: SenaDocs Auth API
  version: 1.0.0
  description: Documentación de los endpoints de Registro e Inicio de Sesión.

servers:
  - url: http://localhost:4000/api
    description: Servidor de Autenticación Local

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ResumenAprendiz:
      type: object
      properties:
        documento: { type: string, example: '1023456789' }
        nombre: { type: string, example: Ana Pérez }
        ficha: { type: string, example: '2547050' }
        juicios: { type: integer, example: 10 }
        juiciosAprobados: { type: integer, example: 7 }
        juiciosPorEvaluar: { type: integer, example: 3 }
        porcentajeJuiciosEvaluados: { type: string, example: '70%' }
        porcentajeJuiciosPorEvaluar: { type: string, example: '30%' }

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags:
        - Autenticación
      summary: Registra un nuevo usuario en el sistema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, apellido, email, password, documento, ciudad, telefono, contacto_emergencia, nombre_contacto, tipo_sangre, fecha_nacimiento, cargo, funciones_trabajo, rol_id ] # <--- CAMPOS OBLIGATORIOS
              properties:
                nombre: { type: string, example: Ana }
                apellido: { type: string, example: Pérez }
                email: { type: string, format: email, example: ana.perez@senadocs.co }
                password: { type: string, example: P4$$w0rdSeguro2025 }
                documento: { type: string, example: '1023456789' }
                centro_formacion: {type: string, example: "Sena CGMLTI" }
                ciudad: {type: string, example: "Bogota" }
                telefono: { type: string, example: '3001234567' }
                fecha_nacimiento: { type: string, format: date, example: '1995-03-15' }
                cargo: { type: string, example: "Funcionario" }
                funciones_trabajo: { type: string, example: 'Análisis de datos.' }
                rol_id: { type: integer, example: 1 }
      responses:
        '201':
          description: Registro exitoso.
        '400':
          description: Faltan campos obligatorios.
        '409':
          description: Email o documento ya registrado.

  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Inicia sesión usando documento y contraseña.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documento, password] # <--- DOCUMENTO y PASSWORD
              properties:
                documento: { type: string, example: '1023456789' }
                password: { type: string, example: P4$$w0rdSeguro2025 }
      responses:
        '200':
          description: Inicio de sesión exitoso. Devuelve el token JWT.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5c... }
        '401':
          description: Credenciales inválidas.

  /auth/forgot-password:
    post:
      tags:
        - Autenticación
      summary: Solicita el restablecimiento de contraseña.
      description: Envía un enlace de recuperación con un token de uso único al email del usuario, si existe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email ]
              properties:
                email: { type: string, format: email, example: usuario.a.recuperar@senadocs.co }
      responses:
        '200':
          description: Mensaje de confirmación de envío (no revela si el email existe por seguridad).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Si el email existe, recibirás un enlace de recuperación." }
        '500':
          description: Error interno del servidor o falla en el envío del email.

  /auth/reset-password/{token}:
    get:
      tags:
        - Autenticación
      summary: Verifica la validez de un token de restablecimiento de contraseña.
      description: Se usa cuando el usuario hace clic en el enlace del email.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: El token generado por la solicitud de restablecimiento.
      responses:
        '200':
          description: Token válido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  email: { type: string, example: usuario.recuperado@senadocs.co }
                  message: { type: string, example: "Token válido" }
        '400':
          description: Token inválido, expirado, o no encontrado.
        '500':
          description: Error al verificar el token.

  /auth/reset-password:
    post:
      tags:
        - Autenticación
      summary: Restablece la contraseña con un token válido.
      description: Procesa el cambio final de contraseña si el token es correcto y no ha expirado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ token, password, confirmPassword ]
              properties:
                token: { type: string, example: 'd385a81e9f4a1c5d6e2b3c4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b' }
                password: { type: string, example: 'NuevaP4ssw0rd2026!' }
                confirmPassword: { type: string, example: "NuevaClaveSegura123!" }
      responses:
        '200':
          description: Contraseña restablecida con éxito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Contraseña actualizada con éxito." }
        '400':
          description: Token inválido, expirado o error de validación de contraseña.
        '500':
          description: Error interno al procesar el cambio.

  /documents/renombrar-descargar:
    post:
      tags:
        - Documentos
      summary: Renombrar PDFs y descargar un archivo ZIP organizado por Ficha.
      description: Sube uno o varios archivos PDF y los renombra según la nomenclatura (Documento_NombreCompleto_Ficha). Crea un ZIP con subcarpetas para separar los archivos de distintas fichas.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [nombreCarpeta, documentos]
              properties:
                nombreCarpeta:
                  type: string
                  description: Nombre de la carpeta principal del ZIP (ej: Certificaciones).
                  example: Certificaciones
                fichaAsignada:
                  type: string
                  description: Código de ficha a asignar a TODOS los archivos si la ficha no se encuentra en el PDF. (Solo requerido si el PDF no tiene ficha).
                  example: "2562076"
                documentos:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: |
                    Lista de archivos PDF a renombrar y procesar.
      responses:
        '200':
          description: Archivo ZIP generado y descargado con éxito.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: Faltan archivos o el nombre de la carpeta / La lógica de extracción falló.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Faltan archivos o el nombre de la carpeta."
        '401':
          description: No autorizado. Token faltante o inválido.
        '500':
          description: Error interno del servidor o error en la compresión ZIP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Error interno al procesar los documentos."

  /juicios-evaluativos/upload-juicios:
    post:
      tags:
        - Juicios Evaluativos
      summary: Procesa un archivo Excel de juicios y retorna el resumen.
      description: Sube un archivo Excel para analizar los juicios de los aprendices. El servidor devuelve un resumen y un ID de archivo (`archivoId`) para generar reportes posteriores.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ archivo ]
              properties:
                archivo:
                  type: string
                  format: binary
                  description: Archivo Excel con el formato de Juicios Evaluativos.
      responses:
        '200':
          description: Archivo procesado con éxito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg: { type: string, example: "Archivo procesado correctamente" }
                  archivoId: { type: string, example: "upload_1678886400000_abcde12" }
                  resumen:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResumenAprendiz'
        '400':
          description: No se recibió ningún archivo.
        '500':
          description: Error interno al procesar el archivo.

  /juicios-evaluativos/reporte/individual/{archivoId}/{documento}:
      get:
        tags:
          - Juicios Evaluativos
        summary: Genera el reporte PDF detallado de un aprendiz.
        description: Usa el ID de la carga y el documento del aprendiz para generar un PDF detallado de todos sus juicios.
        parameters:
          - name: archivoId
            in: path
            required: true
            schema:
              type: string
            description: ID único retornado por `/juicios/upload-juicios`.
          - name: documento
            in: path
            required: true
            schema:
              type: string
            description: Número de documento del aprendiz para el cual se requiere el reporte.
        responses:
          '200':
            description: Reporte PDF generado y listo para descargar.
            content:
              application/pdf:
                schema:
                  type: string
                  format: binary
          '404':
            description: ID de archivo o Documento no encontrado.
          '500':
            description: Error al generar el PDF.

  /juicios-evaluativos/reporte/elegibles/{archivoId}:
      get:
        tags:
          - Juicios Evaluativos
        summary: Genera el reporte PDF de aprendices elegibles (>= 75% aprobado).
        description: Utiliza el ID de la carga para filtrar y generar un PDF con la lista de aprendices que cumplen con el 75% o más de juicios aprobados.
        parameters:
          - name: archivoId
            in: path
            required: true
            schema:
              type: string
            description: ID único retornado por `/juicios/upload-juicios`.
        responses:
          '200':
            description: Reporte PDF de elegibles generado y listo para descargar.
            content:
              application/pdf:
                schema:
                  type: string
                  format: binary
          '404':
            description: ID de archivo no encontrado o sesión expirada.
          '500':
            description: Error al generar el PDF.

  /juicios-evaluativos/reporte/excel-tyt/{archivoId}:
    get:
      tags:
        - Juicios Evaluativos
      summary: Genera el reporte Excel de habilitados para Saber TyT.
      description: |
        Genera un archivo Excel (.xlsx) con el listado de todos los aprendices, su porcentaje de avance 
        y su estado ("HABILITADO" o "NO HABILITADO") basado en el cumplimiento del 75% de juicios aprobados.
      parameters:
        - name: archivoId
          in: path
          required: true
          schema:
            type: string
          description: ID único obtenido tras la carga del Excel original.
      responses:
        '200':
          description: Archivo Excel generado con éxito.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '404':
          description: ID de archivo no encontrado o sesión expirada.
        '500':
          description: Error interno al generar el archivo Excel.