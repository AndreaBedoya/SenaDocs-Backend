openapi: 3.0.0
info:
  title: SenaDocs Auth API
  version: 1.0.0
  description: Documentación de los endpoints de Registro e Inicio de Sesión.

servers:
  - url: http://localhost:4000/api
    description: Servidor de Autenticación Local

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ResumenAprendiz:
      type: object
      properties:
        documento: { type: string, example: '1023456789' }
        nombre: { type: string, example: Ana Pérez }
        ficha: { type: string, example: '2547050' }
        juicios: { type: integer, example: 10 }
        juiciosAprobados: { type: integer, example: 7 }
        juiciosPorEvaluar: { type: integer, example: 3 }
        porcentajeJuiciosEvaluados: { type: string, example: '70%' }
        porcentajeJuiciosPorEvaluar: { type: string, example: '30%' }

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags:
        - Autenticación
      summary: Registra un nuevo usuario en el sistema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, apellido, email, password, documento, ciudad, telefono, contacto_emergencia, nombre_contacto, tipo_sangre, fecha_nacimiento, cargo, funciones_trabajo, rol_id ] # <--- CAMPOS OBLIGATORIOS
              properties:
                nombre: { type: string, example: Ana }
                apellido: { type: string, example: Pérez }
                email: { type: string, format: email, example: ana.perez@senadocs.co }
                password: { type: string, example: P4$$w0rdSeguro2025 }
                documento: { type: string, example: '1023456789' }
                centro_formacion: {type: string, example: "Sena CGMLTI" }
                ciudad: {type: string, example: "Bogota" }
                telefono: { type: string, example: '3001234567' }
                fecha_nacimiento: { type: string, format: date, example: '1995-03-15' }
                cargo: { type: string, example: "Funcionario" }
                funciones_trabajo: { type: string, example: 'Análisis de datos.' }
                rol_id: { type: integer, example: 1 }
      responses:
        '201':
          description: Registro exitoso.
        '400':
          description: Faltan campos obligatorios.
        '409':
          description: Email o documento ya registrado.

  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Inicia sesión usando documento y contraseña.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documento, password] # <--- DOCUMENTO y PASSWORD
              properties:
                documento: { type: string, example: '1023456789' }
                password: { type: string, example: P4$$w0rdSeguro2025 }
      responses:
        '200':
          description: Inicio de sesión exitoso. Devuelve el token JWT.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5c... }
        '401':
          description: Credenciales inválidas.

  /auth/forgot-password:
    post:
      tags:
        - Autenticación
      summary: Solicita el restablecimiento de contraseña.
      description: Envía un enlace de recuperación con un token de uso único al email del usuario, si existe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email ]
              properties:
                email: { type: string, format: email, example: usuario.a.recuperar@senadocs.co }
      responses:
        '200':
          description: Mensaje de confirmación de envío (no revela si el email existe por seguridad).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Si el email existe, recibirás un enlace de recuperación." }
        '500':
          description: Error interno del servidor o falla en el envío del email.

  /auth/reset-password/{token}:
    get:
      tags:
        - Autenticación
      summary: Verifica la validez de un token de restablecimiento de contraseña.
      description: Se usa cuando el usuario hace clic en el enlace del email.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: El token generado por la solicitud de restablecimiento.
      responses:
        '200':
          description: Token válido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  email: { type: string, example: usuario.recuperado@senadocs.co }
                  message: { type: string, example: "Token válido" }
        '400':
          description: Token inválido, expirado, o no encontrado.
        '500':
          description: Error al verificar el token.

  /auth/reset-password:
    post:
      tags:
        - Autenticación
      summary: Restablece la contraseña con un token válido.
      description: Procesa el cambio final de contraseña si el token es correcto y no ha expirado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ token, password, confirmPassword ]
              properties:
                token: { type: string, example: 'd385a81e9f4a1c5d6e2b3c4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b' }
                password: { type: string, example: 'NuevaP4ssw0rd2026!' }
                confirmPassword: { type: string, example: "NuevaClaveSegura123!" }
      responses:
        '200':
          description: Contraseña restablecida con éxito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Contraseña actualizada con éxito." }
        '400':
          description: Token inválido, expirado o error de validación de contraseña.
        '500':
          description: Error interno al procesar el cambio.

  /documents/renombrar-guardar-escritorio:
    post:
      tags:
        - Documentos
      summary: Renombrar PDFs y guardarlos directamente en el Escritorio del servidor.
      description: >
        Sube uno o varios archivos PDF, los renombra según la nomenclatura
        (Documento_NombreCompleto_Ficha) y los guarda en el Escritorio del
        equipo donde está corriendo el backend, dentro de una carpeta
        principal `nombreCarpeta` y subcarpetas por ficha (`nombreCarpeta ficha`).
        En la respuesta JSON indica si la carpeta principal, las carpetas de ficha
        y cada archivo fueron creados o actualizados.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [nombreCarpeta, documentos]
              properties:
                nombreCarpeta:
                  type: string
                  description: Nombre de la carpeta principal que se creará/actualizará en el Escritorio.
                  example: Certificaciones
                fichaAsignada:
                  type: string
                  description: Código de ficha a asignar a TODOS los archivos si la ficha no se encuentra en el PDF.
                  example: "2562076"
                documentos:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Lista de archivos PDF a renombrar y guardar en el Escritorio.
      responses:
        '200':
          description: Archivos procesados y guardados en el Escritorio.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  mensaje_carpeta_principal:
                    type: string
                    description: Indica si la carpeta principal fue creada o actualizada.
                    example: "creado"
                  carpeta_principal:
                    type: string
                    description: Ruta absoluta de la carpeta principal en el Escritorio del servidor.
                  archivos:
                    type: array
                    description: Detalle de cada archivo procesado.
                    items:
                      type: object
                      properties:
                        archivo_original:
                          type: string
                          example: "mi_archivo.pdf"
                        archivo_final:
                          type: string
                          example: "1019986399_RAFAEL_ALEXIS_RAMÍREZ_VELOZA_2711840.pdf"
                        ficha:
                          type: string
                          example: "2711840"
                        ruta:
                          type: string
                          description: Ruta absoluta del archivo guardado en el Escritorio del servidor.
                        estado_archivo:
                          type: string
                          description: Indica si el archivo fue creado o actualizado.
                          example: "creado"
                        estado_carpeta_principal:
                          type: string
                          description: Indica si la carpeta principal fue creada o actualizada.
                          example: "creado"
                        estado_carpeta_ficha:
                          type: string
                          description: Indica si la carpeta de la ficha fue creada o actualizada.
                          example: "actualizado"
                  errores:
                    type: array
                    description: Lista de archivos que no se pudieron procesar.
                    items:
                      type: object
                      properties:
                        archivo:
                          type: string
                        error:
                          type: string
        '400':
          description: Faltan archivos o el nombre de la carpeta / La lógica de extracción falló.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Faltan archivos o el nombre de la carpeta."
                  errores:
                    type: array
                    items:
                      type: object
                      properties:
                        archivo:
                          type: string
                        error:
                          type: string
        '401':
          description: No autorizado. Token faltante o inválido.
        '500':
          description: Error interno del servidor o al guardar los archivos en el Escritorio.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Error interno al procesar y guardar los documentos."

  /juicios-evaluativos/upload-juicios:
    post:
      tags:
        - Juicios Evaluativos
      summary: Procesa un archivo Excel de juicios y retorna el resumen.
      description: Sube un archivo Excel para analizar los juicios de los aprendices. El servidor devuelve un resumen y un ID de archivo (`archivoId`) para generar reportes posteriores.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ archivo ]
              properties:
                archivo:
                  type: string
                  format: binary
                  description: Archivo Excel con el formato de Juicios Evaluativos.
      responses:
        '200':
          description: Archivo procesado con éxito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg: { type: string, example: "Archivo procesado correctamente" }
                  archivoId: { type: string, example: "upload_1678886400000_abcde12" }
                  resumen:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResumenAprendiz'
        '400':
          description: No se recibió ningún archivo.
        '500':
          description: Error interno al procesar el archivo.

  /juicios-evaluativos/reporte/individual/{archivoId}/{documento}:
      get:
        tags:
          - Juicios Evaluativos
        summary: Genera el reporte PDF detallado de un aprendiz.
        description: Usa el ID de la carga y el documento del aprendiz para generar un PDF detallado de todos sus juicios.
        parameters:
          - name: archivoId
            in: path
            required: true
            schema:
              type: string
            description: ID único retornado por `/juicios/upload-juicios`.
          - name: documento
            in: path
            required: true
            schema:
              type: string
            description: Número de documento del aprendiz para el cual se requiere el reporte.
        responses:
          '200':
            description: Reporte PDF generado y listo para descargar.
            content:
              application/pdf:
                schema:
                  type: string
                  format: binary
          '404':
            description: ID de archivo o Documento no encontrado.
          '500':
            description: Error al generar el PDF.

  /juicios-evaluativos/reporte/elegibles/{archivoId}:
      get:
        tags:
          - Juicios Evaluativos
        summary: Genera el reporte PDF de aprendices elegibles (>= 75% aprobado).
        description: Utiliza el ID de la carga para filtrar y generar un PDF con la lista de aprendices que cumplen con el 75% o más de juicios aprobados.
        parameters:
          - name: archivoId
            in: path
            required: true
            schema:
              type: string
            description: ID único retornado por `/juicios/upload-juicios`.
        responses:
          '200':
            description: Reporte PDF de elegibles generado y listo para descargar.
            content:
              application/pdf:
                schema:
                  type: string
                  format: binary
          '404':
            description: ID de archivo no encontrado o sesión expirada.
          '500':
            description: Error al generar el PDF.

  /novedades-academicas/reporte:
    post:
      tags:
        - Novedades Academicas
      summary: Genera un Excel de Novedades Académicas con porcentajes y gráfica.
      description: >
        Sube un archivo Excel que contenga una tabla de Novedades Académicas
        (columnas "Novedad Académica" y "Cantidad"). El servidor calcula los
        porcentajes, genera una tercera columna "Porcentaje" y crea un nuevo
        archivo Excel con la tabla formateada y un gráfico de pastel incrustado.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo:
                  type: string
                  format: binary
                  description: >
                    Archivo Excel con la tabla de Novedades Académicas.
                    Debe tener al menos dos columnas: "Novedad Académica" y "Cantidad".
              required:
                - archivo
      responses:
        '200':
          description: Excel de Novedades Académicas generado correctamente.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: Archivo no proporcionado o no contiene datos válidos de novedades.
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: No se recibió ningún archivo Excel.
        '500':
          description: Error al procesar el archivo o generar el Excel de novedades.
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Error al generar el Excel de novedades académicas.